name: Mobile CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline || npm install
          else
            echo "package.json not yet initialized. Skipping dependency install."
          fi

      - name: Run ESLint
        run: |
          if [ -f package.json ] && npm run | grep -q "lint"; then
            npm run lint
          else
            echo "Lint script not configured yet."
          fi

      - name: Run TypeScript Type Check
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "tsconfig.json not configured yet."
          fi

  database-validation:
    name: Validate Supabase SQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Supabase Schema Syntax
        run: |
          if [ -f supabase/schema.sql ]; then
            echo "Verifying supabase/schema.sql exists and is non-empty..."
            test -s supabase/schema.sql
            echo "Supabase schema verified successfully."
          fi
